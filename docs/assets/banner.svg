<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="EazyDeals E-Commerce Website - Developed by Syed Muhammad Tayyab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1a3a"/>
      <stop offset="55%" stop-color="#123a8a"/>
      <stop offset="100%" stop-color="#2874f0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe500"/>
      <stop offset="100%" stop-color="#ffb800"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="380" rx="24"/></clipPath>
    <style>
      .t{font-family:'Segoe UI',Poppins,Arial,sans-serif}
      .float{animation:float 5s ease-in-out infinite}
      .float2{animation:float 6.5s ease-in-out infinite reverse}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      .sweep{animation:sweep 4.5s linear infinite}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.6s linear infinite}
      .cart{animation:roll 9s ease-in-out infinite}
      .fade{animation:fade 1.2s ease-out both}
      .fade2{animation:fade 1.2s .35s ease-out both}
      .fade3{animation:fade 1.2s .7s ease-out both}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes sweep{0%{transform:translateX(-400px)}100%{transform:translateX(1400px)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes roll{0%,100%{transform:translateX(0)}50%{transform:translateX(-60px)}}
      @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle cx="1060" cy="70" r="170" fill="#ffe500" opacity=".08"/>
    <circle cx="120" cy="360" r="140" fill="#ffffff" opacity=".05"/>
    <rect class="sweep" x="0" y="0" width="260" height="380" fill="url(#shine)" transform="skewX(-20)"/>

    <!-- header strip -->
    <rect x="0" y="0" width="1200" height="44" fill="#000000" opacity=".25"/>
    <circle class="pulse" cx="34" cy="22" r="6" fill="#22c55e"/>
    <text class="t" x="50" y="28" font-size="15" fill="#ffffff" font-weight="600" letter-spacing="1">Developed by Syed Muhammad Tayyab</text>
    <text class="t" x="1166" y="28" font-size="13" fill="#cfe0ff" text-anchor="end" letter-spacing="2">JAVA • JSP • SERVLET • JDBC • MYSQL</text>

    <!-- title block -->
    <g class="fade">
      <rect x="60" y="88" width="168" height="30" rx="15" fill="url(#gold)"/>
      <text class="t" x="144" y="108" font-size="14" font-weight="800" fill="#0b1a3a" text-anchor="middle" letter-spacing="2">E-COMMERCE</text>
    </g>
    <g class="fade2">
      <text class="t" x="58" y="190" font-size="76" font-weight="900" fill="#ffffff">Eazy<tspan fill="url(#gold)">Deals</tspan></text>
    </g>
    <g class="fade3">
      <text class="t" x="62" y="232" font-size="22" fill="#dbe7ff">Full-stack online shopping platform with a complete admin panel</text>
      <text class="t" x="62" y="264" font-size="16" fill="#9fbaf0">Cart • Wishlist • Checkout • Orders • OTP password reset • Email notifications</text>
    </g>

    <!-- chips -->
    <g class="t" font-size="13" font-weight="700">
      <rect x="62" y="296" width="96" height="30" rx="8" fill="#ffffff" opacity=".12"/>
      <text x="110" y="316" fill="#ffffff" text-anchor="middle">☕ Java 17</text>
      <rect x="168" y="296" width="112" height="30" rx="8" fill="#ffffff" opacity=".12"/>
      <text x="224" y="316" fill="#ffffff" text-anchor="middle">🐱 Tomcat 10</text>
      <rect x="290" y="296" width="106" height="30" rx="8" fill="#ffffff" opacity=".12"/>
      <text x="343" y="316" fill="#ffffff" text-anchor="middle">🐬 MySQL 8</text>
      <rect x="406" y="296" width="124" height="30" rx="8" fill="#ffffff" opacity=".12"/>
      <text x="468" y="316" fill="#ffffff" text-anchor="middle">🅱️ Bootstrap 5</text>
    </g>

    <!-- shopping cart illustration -->
    <g class="cart" transform="translate(830 120)">
      <g class="float">
        <rect x="70" y="-30" width="70" height="70" rx="10" fill="#ffe500" transform="rotate(-8 105 5)"/>
        <rect x="150" y="-10" width="60" height="60" rx="10" fill="#ffffff" opacity=".9" transform="rotate(6 180 20)"/>
        <rect x="110" y="-70" width="54" height="54" rx="10" fill="#38bdf8" transform="rotate(10 137 -43)"/>
        <text x="105" y="14" font-size="30" text-anchor="middle" transform="rotate(-8 105 5)">📱</text>
        <text x="180" y="32" font-size="26" text-anchor="middle">🎧</text>
        <text x="137" y="-34" font-size="24" text-anchor="middle">👟</text>
      </g>
      <path d="M0 20 H40 L80 170 H250 L280 60 H60" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M62 70 H272" stroke="#ffffff" stroke-opacity=".35" stroke-width="4"/>
      <path d="M70 110 H262" stroke="#ffffff" stroke-opacity=".35" stroke-width="4"/>
      <g class="wheel"><circle cx="105" cy="200" r="18" fill="#0b1a3a" stroke="#ffffff" stroke-width="6"/><path d="M105 186 V214 M91 200 H119" stroke="#ffe500" stroke-width="3"/></g>
      <g class="wheel"><circle cx="230" cy="200" r="18" fill="#0b1a3a" stroke="#ffffff" stroke-width="6"/><path d="M230 186 V214 M216 200 H244" stroke="#ffe500" stroke-width="3"/></g>
    </g>

    <!-- floating tags -->
    <g class="float2 t">
      <rect x="690" y="80" width="118" height="36" rx="18" fill="#22c55e"/>
      <text x="749" y="104" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">-42% OFF</text>
    </g>
    <g class="float t">
      <rect x="700" y="300" width="132" height="36" rx="18" fill="#ffffff"/>
      <text x="766" y="324" font-size="14" font-weight="800" fill="#2874f0" text-anchor="middle">✔ Order Placed</text>
    </g>
  </g>
</svg>
